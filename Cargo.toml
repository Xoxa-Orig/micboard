[package]
name = "micboard"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Play media files into your microphone with global hotkeys"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Xoxa-Orig/micboard"
keywords = ["soundboard", "microphone", "hotkey", "pipewire", "audio"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
env_logger = "0.11.11"
global-hotkey = "0.9"
log = "0.4.35"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis", "mp4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
